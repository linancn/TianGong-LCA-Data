name: Publish (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-downloads-retired:
    name: Release downloads retired
    runs-on: ubuntu-latest

    steps:
      - name: Explain release retirement
        run: |
          cat <<'NOTICE'
          GitHub Release downloads for TianGong LCA Data are retired as of 2026-06-21.
          This workflow no longer creates tags, archives, GitHub Releases, or release assets.
          For the latest data, use the TianGong LCA Platform export flow:
          https://lca.tiangong.earth/
          NOTICE
