name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch main
      run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

    - name: Install stable Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install docpact
      run: cargo install docpact --version 0.1.9 --force

    - name: Run docpact release gate
      run: scripts/docpact-gate.sh --base origin/main

  build:
    needs: release-gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Get tag name
      id: tag_name
      run: echo "TAG_NAME=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

    - name: Zip the code
      run: cd tiangong_lca_data && zip -r ../tiangong-lca-data-${{ steps.tag_name.outputs.TAG_NAME }}.zip *

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          tiangong-lca-data-${{ steps.tag_name.outputs.TAG_NAME }}.zip
          LICENSE
        body_path: ./release_notes/${{ steps.tag_name.outputs.TAG_NAME }}.md        
